name: FastAPI CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  # ==========================================
  # JOB 1: TEST
  # ==========================================

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest

  # ==========================================
  # JOB 2: BUILD + PUSH DOCKER IMAGE
  # ==========================================

  docker:
    needs: test

    runs-on: ubuntu-latest

    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true

          tags: |
            ${{ secrets.DOCKER_USERNAME }}/fastapi-cicd-demo:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/fastapi-cicd-demo:latest

  # ==========================================
  # JOB 3: DEPLOY TO AWS EC2
  # ==========================================

  deploy:
    needs: docker

    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}

          username: ${{ secrets.EC2_USERNAME }}

          key: ${{ secrets.EC2_SSH_KEY }}

          script: |

            echo "Starting deployment..."

            echo "Pulling new Docker image..."

            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/fastapi-cicd-demo:${{ github.sha }}


            echo "Stopping old container..."

            sudo docker stop fastapi-demo || true


            echo "Removing old container..."

            sudo docker rm fastapi-demo || true


            echo "Starting new container..."

            sudo docker run -d \
              --name fastapi-demo \
              --restart unless-stopped \
              -p 8000:8000 \
              ${{ secrets.DOCKER_USERNAME }}/fastapi-cicd-demo:${{ github.sha }}


            echo "Removing unused Docker images..."

            sudo docker image prune -f


            echo "Deployment completed!"

            echo "Running containers:"

            sudo docker ps
